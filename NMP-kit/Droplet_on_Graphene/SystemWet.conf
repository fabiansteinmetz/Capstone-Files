# DROPLET ABOVE GRAPHENE - overnight wetting run: top + bottom graphene layers fixed, inner layers and NMP free (NVT, Langevin)
# Paths are relative to THIS file's folder (NAMD changes into it).
structure          System/system.psf
coordinates        System/system.pdb
#bincoordinates    System/system.coor     ;# use this instead if the pdb is garbled (>99,999 atoms)
paraTypeCharmm     on
parameters         ../inputs/par_all36m_prot.prm
parameters         ../inputs/par_all36_na.prm
parameters         ../inputs/par_all36_carb.prm
parameters         ../inputs/par_all36_lipid.prm
parameters         ../inputs/par_all36_cgenff.prm
parameters         ../inputs/NMP.prm
# graphene carbons are typed CG2R61 by make_system.tcl: parameters come from par_all36_cgenff.prm (no extra file)

temperature        300
source             System/cell.inc

fixedAtoms         on
fixedAtomsFile     System/fix.pdb
fixedAtomsCol      B

set outputName     SystemWet/SystemWet
outputName         $outputName
binaryoutput       no
binaryrestart      yes
outputEnergies     1000
restartfreq        5000
dcdfreq            5000
XSTFreq            5000

timestep           2.0
fullElectFrequency 1
nonbondedFreq      1
exclude            scaled1-4
1-4scaling         1.0
switching          on
switchdist         10.0
cutoff             12.0
pairlistdist       14.0
wrapAll            off
PME                yes
PMEGridSpacing     1.0
PMETolerance       10e-6
PMEInterpOrder     4

langevin           on
langevinTemp       300
langevinDamping    1.0

minimize          500      ;# remove any bad contacts from the new start (only a few seconds)
run                2000000  ;# 4 ns, about 10 h at 0.0186 s/step
