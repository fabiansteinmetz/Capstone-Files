# SLAB PRODUCTION: box-averaged pressure tensor every 100 steps.
# gamma = (Lz/2)*(Pzz-(Pxx+Pyy)/2)/100 via analyze_film.sh
structure                 ../Solvate/NMP-100A.psf
coordinates               ../Solvate/NMP-100A.pdb
paraTypeCharmm            on
parameters                ../inputs/par_all36m_prot.prm
parameters                ../inputs/par_all36_na.prm
parameters                ../inputs/par_all36_carb.prm
parameters                ../inputs/par_all36_lipid.prm
parameters                ../inputs/par_all36_cgenff.prm
parameters                ../inputs/NMP.prm

binCoordinates   SlabEquil/SlabEquil.restart.coor
binVelocities    SlabEquil/SlabEquil.restart.vel
extendedSystem   SlabEquil/SlabEquil.restart.xsc
set outputName   SlabProd/SlabProd
outputName       $outputName
binaryoutput     no
binaryrestart    yes
outputEnergies   100
outputPressure   100
restartfreq      50000
dcdfreq          5000
XSTFreq          5000
timestep                  2.0
fullElectFrequency        1
nonbondedFreq             1
exclude                   scaled1-4
1-4scaling                1.0
switching                 on
switchdist                10.0
cutoff                    12.0
pairlistdist              14.0
wrapAll                   off
PME                       yes
PMEGridSpacing            1.0
PMETolerance              10e-6
PMEInterpOrder            4
langevin                  on
langevinTemp              300
langevinDamping           1.0

run              2500000   ;# 5 ns