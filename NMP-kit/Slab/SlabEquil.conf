# SLAB EQUILIBRATION: bulk cube + vacuum along z only (thermostat only, no barostat).
structure                 ../Solvate/NMP-100A.psf
coordinates               ../Solvate/NMP-100A.pdb
paraTypeCharmm            on
parameters                ../inputs/par_all36m_prot.prm
parameters                ../inputs/par_all36_na.prm
parameters                ../inputs/par_all36_carb.prm
parameters                ../inputs/par_all36_lipid.prm
parameters                ../inputs/par_all36_cgenff.prm
parameters                ../inputs/NMP.prm

# >>> EDIT these 3 lines <<<
set start   ../NVT2/output_270926          ;# folder/prefix of the equilibrated cube
set boxXY   98.4657964777         ;# a_x from the last line of start.restart.xsc
set boxZ    298.4657964777        ;# boxXY + 2*100 A of vacuum

cellBasisVector1   $boxXY 0 0
cellBasisVector2   0 $boxXY 0
cellBasisVector3   0 0 $boxZ
cellOrigin         0 0 0
binCoordinates     $start.restart.coor
binVelocities      $start.restart.vel
set outputName     SlabEquil
outputName         $outputName
binaryoutput       no
binaryrestart      yes
outputEnergies     1000
outputPressure     1000
restartfreq        5000
dcdfreq            5000
XSTFreq            5000
timestep                  2.0
fullElectFrequency        1
nonbondedFreq             1
exclude                   scaled1-4
1-4scaling                1.0
switching                 on
switchdist                10.0
cutoff                    12.0
pairlistdist              14.0
wrapAll                   off
PME                       yes
PMEGridSpacing            1.0
PMETolerance              10e-6
PMEInterpOrder            4
langevin                  on
langevinTemp              300
langevinDamping           1.0

run                1000000   ;# 2 ns
