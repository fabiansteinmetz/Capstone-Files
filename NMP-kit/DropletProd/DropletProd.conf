###################################################
# DROPLET PRODUCTION — NMP sphere in vacuum            #
# Continues from DropletEquil once the cube has          #
# relaxed into a stable sphere. This is the stage whose   #
# trajectory you'd actually use for the pressure/stress    #
# tensor measurement (Laplace pressure -> surface tension). #
###################################################

structure                 ../Solvate/NMP-100A.psf
coordinates                ../Solvate/NMP-100A.pdb  ;# reference only

paraTypeCharmm             on
parameters                  ../inputs/par_all36m_prot.prm
parameters                  ../inputs/par_all36_na.prm
parameters                  ../inputs/par_all36_carb.prm
parameters                  ../inputs/par_all36_lipid.prm
parameters                  ../inputs/par_all36_cgenff.prm
parameters                  ../inputs/NMP.prm

set inputname                 ../Droplet/DropletEquil
binCoordinates                 $inputname.restart.coor
binVelocities                   $inputname.restart.vel
extendedSystem                   $inputname.restart.xsc  ;# same 300 A vacuum box carried forward

set outputName                    DropletProd
outputName                         $outputName
binaryoutput                       no
binaryrestart                      yes
outputtiming                       1000
outputenergies                     1000
outputpressure                     1000
restartfreq                        1000
dcdfreq                            1000
XSTFreq                            1000

set temperature                     300

timestep                            2.0
fullElectFrequency                   1
nonbondedFreq                        1
exclude                              scaled1-4
1-4scaling                           1.0

switching                            on
switchdist                           10.0
cutoff                                12.0
pairlistdist                           14.0

wrapAll                               off

PME                                   yes
PMEGridSpacing                         1.0
PMETolerance                            10e-6
PMEInterpOrder                           4

langevin                                on
langevinTemp                             $temperature
langevinDamping                           1.0

# RUN — production length for the pressure/stress-tensor measurement.
# Another starting guess (5 ns) — since this feeds a physical measurement
# rather than just a stability check, longer is safer; extend if the
# radius/pressure estimate is still noisy rather than converging.
run                                      200000
