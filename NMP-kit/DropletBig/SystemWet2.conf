# BIG DROPLET ABOVE GRAPHENE - CONTINUATION of SystemWet (part 2): same settings, starts from SystemWet's final restart files
# Paths are relative to THIS file's folder (NAMD changes into it).
structure          System/system.psf
coordinates        System/system.pdb
#bincoordinates    System/system.coor     ;# use this instead if the pdb is garbled (>99,999 atoms)
paraTypeCharmm     on
parameters         ../inputs/par_all36m_prot.prm
parameters         ../inputs/par_all36_na.prm
parameters         ../inputs/par_all36_carb.prm
parameters         ../inputs/par_all36_lipid.prm
parameters         ../inputs/par_all36_cgenff.prm
parameters         ../inputs/NMP.prm
# graphene carbons are typed CG2R61 by make_system.tcl: parameters come from par_all36_cgenff.prm (no extra file)

# start from the end of SystemWet: positions, velocities and cell (+ step number) all come from its restart files
bincoordinates     SystemWet/SystemWet.restart.coor
binvelocities      SystemWet/SystemWet.restart.vel
extendedSystem     SystemWet/SystemWet.restart.xsc

fixedAtoms         on
fixedAtomsFile     System/fix.pdb
fixedAtomsCol      B

set outputName     SystemWet2/SystemWet2
outputName         $outputName
binaryoutput       no
binaryrestart      yes
outputEnergies     1000
restartfreq        5000
dcdfreq            5000
XSTFreq            5000

timestep           2.0
fullElectFrequency 1
nonbondedFreq      1
exclude            scaled1-4
1-4scaling         1.0
switching          on
switchdist         10.0
cutoff             12.0
pairlistdist       14.0
wrapAll            off
PME                yes
PMEGridSpacing     1.0
PMETolerance       10e-6
PMEInterpOrder     4

langevin           on
langevinTemp       300
langevinDamping    1.0

run                1250000  ;# another 4 ns (about 22 h at 0.0405 s/step)
