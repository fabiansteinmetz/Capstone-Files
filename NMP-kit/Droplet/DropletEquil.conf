###################################################
# DROPLET SHAPE EQUILIBRATION — NMP in vacuum        #
# Starts from NVT2's equilibrated bulk cube,          #
# re-boxed into a much larger vacuum-padded cell.       #
# No barostat — surface tension alone should pull the   #
# exposed cube into a roughly spherical droplet.         #
###################################################

# TOPOLOGY — unchanged; same molecules, just repositioned/re-boxed
structure                 ../Solvate/NMP-100A.psf
coordinates                ../Solvate/NMP-100A.pdb  ;# reference only — real start coords come from binCoordinates below

# INPUT — FORCE FIELD PARAMETERS (same set/order as every prior stage)
paraTypeCharmm             on
parameters                  ../inputs/par_all36m_prot.prm
parameters                  ../inputs/par_all36_na.prm
parameters                  ../inputs/par_all36_carb.prm
parameters                  ../inputs/par_all36_lipid.prm
parameters                  ../inputs/par_all36_cgenff.prm
parameters                  ../inputs/NMP.prm

# STARTING STRUCTURE — NVT2's final, bulk-equilibrated cube
# Deliberately NOT using extendedSystem here: NVT2's box was only ~100 A,
# we want a much bigger vacuum-padded box instead (set explicitly below).
set inputname                 ../NVT2/NVT2
binCoordinates                 $inputname.restart.coor
binVelocities                   $inputname.restart.vel   ;# already thermalized — no need to regenerate

# OUTPUT
set outputName                    DropletEquil
outputName                         $outputName
binaryoutput                       no
binaryrestart                      yes
outputtiming                       1000
outputenergies                     1000
outputpressure                     1000
restartfreq                        1000
dcdfreq                            1000
XSTFreq                            1000

set temperature                     300
# No "temperature" command — binVelocities above carries NVT2's real velocities forward.

# INTEGRATOR
timestep                            2.0
fullElectFrequency                   1
nonbondedFreq                        1
exclude                              scaled1-4
1-4scaling                           1.0

# LONG-RANGE INTERACTIONS SETUP
switching                            on
switchdist                           10.0
cutoff                                12.0
pairlistdist                           14.0

# PERIODIC CELL — large, vacuum-padded cube, same center as the original
# 100 A system (so NVT2's cube of liquid starts centered in the new box).
# 300 A side: original 100 A cube's ~62 A equivalent-sphere radius leaves
# ~88 A of vacuum on every side once it rounds up, enough separation that
# periodic images shouldn't meaningfully interact. Revisit if PME grid
# setup/runtime becomes a problem, or if the droplet turns out larger
# than expected once it relaxes.
cellBasisVector1                     300.0    0.0    0.0
cellBasisVector2                       0.0  300.0    0.0
cellBasisVector3                       0.0    0.0  300.0
cellOrigin                             0.0    0.0    0.0

wrapAll                               off   ;# keep off here — with this much vacuum padding nothing should
                                             ;# approach the box edge, and we'd rather not risk wrapping
                                             ;# splitting the droplet across a boundary during analysis

# PME
PME                                   yes
PMEGridSpacing                         1.0
PMETolerance                            10e-6
PMEInterpOrder                           4

# TEMPERATURE CONTROL — thermostat only. No barostat: pressure is not a
# well-defined global quantity for a cluster-in-vacuum system (that's the
# whole point — pressure here is a LOCAL quantity you measure in post-
# processing, not something to control during the run).
langevin                                on
langevinTemp                             $temperature
langevinDamping                           1.0

# RUN — initial shape-relaxation stage. This duration is a starting guess:
# watch whether the system actually looks spherical and whether its radius
# of gyration / shape has stopped changing before trusting this is enough.
# Extend if it's still visibly reshaping when this finishes.
run                                      1000000   ;# 2 ns at 2 fs/step
