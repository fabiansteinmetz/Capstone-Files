###################################################
# SPHERE EQUILIBRATION - NMP droplet in vacuum
# Start: a sphere cut from the equilibrated bulk cube (Input/sphere.psf/.pdb).
# Only the new surface has to relax. Thermostat only, no barostat.
# Paths are relative to THIS file's folder (NAMD changes into it).
###################################################
structure          Input/sphere.psf
coordinates        Input/sphere.pdb
paraTypeCharmm     on
parameters         ../inputs/par_all36m_prot.prm
parameters         ../inputs/par_all36_na.prm
parameters         ../inputs/par_all36_carb.prm
parameters         ../inputs/par_all36_lipid.prm
parameters         ../inputs/par_all36_cgenff.prm
parameters         ../inputs/NMP.prm

temperature        300          ;# new random velocities at 300 K

# cubic vacuum box, sphere centred on the origin (diameter ~92 A -> ~88 A of vacuum between periodic images)
cellBasisVector1   180.0 0.0 0.0
cellBasisVector2   0.0 180.0 0.0
cellBasisVector3   0.0 0.0 180.0
cellOrigin         0.0 0.0 0.0
wrapAll            off

set outputName     SphereEquil/SphereEquil
outputName         $outputName
binaryoutput       no
binaryrestart      yes
outputEnergies     1000
outputPressure     1000
restartfreq        5000
dcdfreq            5000
XSTFreq            5000

timestep           2.0
fullElectFrequency 1
nonbondedFreq      1
exclude            scaled1-4
1-4scaling         1.0
switching          on
switchdist         10.0
cutoff             12.0
pairlistdist       14.0
PME                yes
PMEGridSpacing     1.0
PMETolerance       10e-6
PMEInterpOrder     4

langevin           on
langevinTemp       300
langevinDamping    1.0

run                1000000      ;# 2 ns
